<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" fill="none">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
    <stop stop-color="#F7F8FC"/><stop offset="1" stop-color="#ECF2FF"/>
  </linearGradient>
  <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#FF7A3D"/><stop offset="1" stop-color="#FFB26B"/>
  </linearGradient>
  <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#162033"/><stop offset="1" stop-color="#30486F"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#162033" flood-opacity="0.10"/>
  </filter>
  <style>
    .t{font-family:Inter,Arial,sans-serif;fill:#162033}.m{font-family:Inter,Arial,sans-serif;fill:#6D7B93}.w{fill:#fff}.n{fill:#162033}.o{fill:#FF7A3D}
  </style>
</defs>
<rect width="1600" height="900" rx="42" fill="url(#bg)"/>
<rect x="60" y="60" width="1480" height="780" rx="34" fill="#fff" opacity="0.76"/>
<text x="110" y="150" class="t" font-size="28" font-weight="800">Így lesz a látogatóból megkeresés</text>
<text x="110" y="190" class="m" font-size="20" font-weight="600">A szöveg helyett a felépítés és a vizuális logika dolgozik.</text>

