<text x="1280" y="308" class="t" font-size="26" font-weight="800" fill="#fff">Gyors reakció</text>
<text x="1280" y="344" class="m" font-size="18" font-weight="700" fill="rgba(255,255,255,.74)">visszahívás vagy email</text>
