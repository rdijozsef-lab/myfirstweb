<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" fill="none">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="760"><stop stop-color="#FFF8F3"/><stop offset="1" stop-color="#F6F8FC"/></linearGradient>
  <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FF7A3D"/><stop offset="1" stop-color="#FFB26B"/></linearGradient>
  <style>.t{font-family:Inter,Arial,sans-serif;fill:#162033}.m{font-family:Inter,Arial,sans-serif;fill:#6D7B93}.w{fill:#fff}</style>
