<rect x="635" y="240" width="330" height="340" rx="34" fill="#fff"/>
<rect x="1160" y="240" width="330" height="340" rx="34" fill="#162033"/>
<circle cx="180" cy="312" r="34" fill="url(#grad)"/><text x="180" y="323" text-anchor="middle" class="w" font-size="22" font-weight="800">1</text>
<text x="230" y="308" class="t" font-size="26" font-weight="800">Alap adatok</text><text x="230" y="344" class="m" font-size="18" font-weight="700">név • email • telefon</text>
