<circle cx="705" cy="312" r="34" fill="#162033"/><text x="705" y="323" text-anchor="middle" class="w" font-size="22" font-weight="800">2</text>
<text x="755" y="308" class="t" font-size="26" font-weight="800">Cél és csomag</text><text x="755" y="344" class="m" font-size="18" font-weight="700">pár gyors választás</text>
