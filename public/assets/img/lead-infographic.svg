<rect width="1600" height="760" rx="42" fill="url(#bg)"/>
<text x="110" y="120" class="t" font-size="28" font-weight="800">Ajánlatkérés, amit könnyű elkezdeni</text>
<text x="110" y="160" class="m" font-size="20" font-weight="600">A rövid formok több embert visznek végig, mint a hosszú vallató űrlapok.</text>
